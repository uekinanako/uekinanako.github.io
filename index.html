<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お肉の妖精</title>
  <link rel="icon" type="image/png" href="./character.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #ffe4f0 0%, #fff0f8 45%, #ede0ff 100%);
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── 背景のきらきら ── */
    .bg-sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .sp {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--dur, 3s) var(--delay, 0s) infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50%      { opacity: 0.7; transform: scale(1) rotate(180deg); }
    }

    /* ── メインコンテナ ── */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ── キャラクター ── */
    .chara-wrap {
      animation: float 3.2s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(220,140,180,0.35));
    }
    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(-1deg); }
      50%      { transform: translateY(-14px) rotate(1deg); }
    }
    .chara-wrap img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    /* ── 名前 ── */
    .name {
      font-size: 1.65rem;
      font-weight: 700;
      color: #8b3a5a;
      letter-spacing: 0.06em;
      text-shadow: 0 2px 0 #fff, 0 0 24px rgba(255,150,200,0.5);
    }

    /* ── プロフ ── */
    .bio {
      font-size: 0.82rem;
      color: #b07090;
      letter-spacing: 0.1em;
      margin-top: -6px;
    }

    /* ── デコ区切り ── */
    .deco {
      font-size: 1rem;
      letter-spacing: 0.3em;
      color: #e8aac8;
      margin: 2px 0;
    }

    /* ── リンクボタン群 ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 20px;
      border-radius: 999px;
      text-decoration: none;
      color: #6b3a52;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(255,255,255,0.78);
      border: 2px solid rgba(255,180,215,0.45);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(240,160,200,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .btn:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.96);
      box-shadow: 0 10px 28px rgba(240,150,195,0.32);
    }
    .btn:active { transform: translateY(-1px); }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .btn-label { flex: 1; text-align: center; }

    /* プラットフォームカラー */
    .x-icon   { background: #000; }
    .yt-icon  { background: #ff0000; }
    .ig-icon  { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
    .tt-icon  { background: #010101; }
    .fb-icon  { background: #1877f2; }
    .line-icon { background: #06C755; }

    /* ── Brainバナー ── */
    .brain-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      text-decoration: none;
      background: linear-gradient(135deg, #6a3fc9 0%, #a259ff 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 6px 24px rgba(106,63,201,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.18s, box-shadow 0.18s;
      animation: pulse-glow-brain 2.4s ease-in-out infinite;
    }
    .brain-banner:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(106,63,201,0.6);
    }
    .brain-banner:active { transform: translateY(-1px); }
    @keyframes pulse-glow-brain {
      0%,100% { box-shadow: 0 6px 24px rgba(106,63,201,0.45), inset 0 1px 0 rgba(255,255,255,0.25); }
      50%      { box-shadow: 0 6px 36px rgba(106,63,201,0.75), inset 0 1px 0 rgba(255,255,255,0.25); }
    }
    .brain-banner .brain-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    .brain-banner .brain-text { line-height: 1.25; }
    .brain-banner .brain-sub { font-size: 0.72rem; font-weight: 400; opacity: 0.88; }

    /* ── Substackバナー ── */
    .substack-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      text-decoration: none;
      background: linear-gradient(135deg, #ff6314 0%, #ff8c42 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 6px 24px rgba(255,99,20,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.18s, box-shadow 0.18s;
      animation: pulse-glow 2.4s ease-in-out infinite;
    }
    .substack-banner:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(255,99,20,0.6);
    }
    .substack-banner:active { transform: translateY(-1px); }
    @keyframes pulse-glow {
      0%,100% { box-shadow: 0 6px 24px rgba(255,99,20,0.45), inset 0 1px 0 rgba(255,255,255,0.25); }
      50%      { box-shadow: 0 6px 36px rgba(255,99,20,0.75), inset 0 1px 0 rgba(255,255,255,0.25); }
    }
    .substack-banner .ss-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .substack-banner .ss-text { line-height: 1.25; }
    .substack-banner .ss-sub { font-size: 0.72rem; font-weight: 400; opacity: 0.88; }

    /* ── フッター ── */
    .footer {
      margin-top: 12px;
      font-size: 0.68rem;
      color: #d4a0c0;
      letter-spacing: 0.15em;
    }
  </style>
</head>

<script>
  // 背景きらきら生成
  const container = document.getElementById('sparkles');
  const colors = ['#ffb3d9','#e8c0ff','#ffd6a5','#b3e8ff','#c0ffda'];
  const shapes = ['✦','✧','⋆','·','✿','♡'];

  for (let i = 0; i < 28; i++) {
    const el = document.createElement('span');
    el.className = 'sp';
    el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
    el.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      font-size: ${8 + Math.random() * 14}px;
      color: ${colors[Math.floor(Math.random() * colors.length)]};
      --dur: ${2 + Math.random() * 3}s;
      --delay: ${Math.random() * 4}s;
      background: none;
      border-radius: 0;
    `;
    container.appendChild(el);
  }
</script>
